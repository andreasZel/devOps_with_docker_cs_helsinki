version: "3.1"

services:
  frontend:
    image: frontend-example
    ports:
      - "5000:5000"
    container_name: frontend

  redis:
    image: redis 
    container_name: redis 

  backend:
    image: go-project
    command: ./server 
    ports:
      - "8080:8080"
    environment:
      - REDIS_HOST=redis
    container_name: backend
  
  
